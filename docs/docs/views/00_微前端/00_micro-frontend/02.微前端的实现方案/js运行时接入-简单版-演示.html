<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JS 运行时接入演示</title>
    <style>
      :root {
        --bg: #f6f1e8;
        --paper: rgba(255, 252, 247, 0.92);
        --ink: #1c2a39;
        --muted: #65707c;
        --line: rgba(28, 42, 57, 0.1);
        --main: #194d63;
        --accent: #a6512a;
        --shadow: 0 22px 50px rgba(27, 39, 50, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at top left, rgba(25, 77, 99, 0.09), transparent 28%),
          radial-gradient(circle at right bottom, rgba(166, 81, 42, 0.12), transparent 24%),
          linear-gradient(180deg, #f8f3ea 0%, #f1eadf 100%);
      }

      .page {
        max-width: 1440px;
        margin: 0 auto;
        padding: 28px;
      }

      .shell {
        display: grid;
        grid-template-columns: 260px 1fr;
        gap: 18px;
        padding: 18px;
        border-radius: 34px;
        border: 1px solid var(--line);
        background: var(--paper);
        box-shadow: var(--shadow);
      }

      .sidebar,
      .workspace {
        border-radius: 26px;
        overflow: hidden;
      }

      .sidebar {
        padding: 22px;
        background: linear-gradient(180deg, #183d50 0%, #1f5870 100%);
        color: #edf7fb;
      }

      .brand {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 24px;
      }

      .brand strong {
        font-size: 20px;
      }

      .tag {
        display: inline-flex;
        align-items: center;
        padding: 6px 10px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.05em;
        color: #edf7fb;
        background: rgba(255, 255, 255, 0.14);
      }

      .nav-title {
        margin: 0 0 10px;
        font-size: 13px;
        color: rgba(237, 247, 251, 0.72);
        letter-spacing: 0.08em;
      }

      .menu {
        display: grid;
        gap: 10px;
      }

      .menu button {
        appearance: none;
        border: 1px solid rgba(255, 255, 255, 0.16);
        background: rgba(255, 255, 255, 0.08);
        color: #f2f8fb;
        border-radius: 18px;
        padding: 14px 16px;
        text-align: left;
        font-size: 15px;
        cursor: pointer;
      }

      .menu button.active {
        color: var(--main);
        background: #f0f6f8;
      }

      .workspace {
        display: flex;
        flex-direction: column;
        background: linear-gradient(180deg, #fffdfa 0%, #f8f2ea 100%);
        border: 1px solid rgba(28, 42, 57, 0.1);
      }

      .topbar {
        padding: 20px 24px;
        background: rgba(255, 255, 255, 0.84);
        border-bottom: 1px solid rgba(28, 42, 57, 0.08);
      }

      .topbar h1 {
        margin: 0;
        font-size: 28px;
      }

      .stage {
        padding: 24px;
      }

      #subapp {
        min-height: 620px;
        padding: 20px;
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.62);
        border: 1px dashed rgba(25, 77, 99, 0.18);
      }

      .child-panel {
        padding: 26px;
        border-radius: 24px;
        border: 1px solid rgba(28, 42, 57, 0.08);
        background: rgba(255, 255, 255, 0.94);
      }

      .child-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 14px;
        margin-bottom: 10px;
      }

      .child-badge {
        display: inline-flex;
        align-items: center;
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(25, 77, 99, 0.08);
        color: var(--main);
        font-size: 12px;
        font-weight: 700;
      }

      .child-badge.finance {
        background: rgba(166, 81, 42, 0.1);
        color: var(--accent);
      }

      .child-panel h2 {
        margin: 0;
        font-size: 28px;
      }

      .child-list {
        margin-top: 18px;
        display: grid;
        gap: 12px;
      }

      .child-item {
        padding: 16px;
        border-radius: 18px;
        background: rgba(25, 77, 99, 0.05);
        color: var(--ink);
        line-height: 1.8;
      }

      .child-item.finance {
        background: rgba(166, 81, 42, 0.08);
      }

      @media (max-width: 1080px) {
        .shell {
          grid-template-columns: 1fr;
        }

        .child-head {
          flex-direction: column;
          align-items: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <section class="shell">
        <aside class="sidebar">
          <div class="brand">
            <strong>运营管理平台</strong>
          </div>

          <div class="menu">
            <button class="menu-btn active" data-app="order">订单管理</button>
            <button class="menu-btn" data-app="finance">财务管理</button>
          </div>
        </aside>

        <main class="workspace">
          <div class="topbar">
            <h1>JavaScript 运行时接入</h1>
          </div>

          <div class="stage">
            <div id="subapp"></div>
          </div>
        </main>
      </section>
    </div>

    <script>
      const subapp = document.getElementById('subapp');
      const buttons = document.querySelectorAll('.menu-btn');

      const orderApp = {
        mount(container) {
          container.innerHTML = `
            <section class="child-panel">
              <div class="child-head">
                <div>
                  <span class="child-badge">订单子应用</span>
                  <h2>订单管理</h2>
                </div>
              </div>
              <div class="child-list">
                <div class="child-item">订单列表</div>
                <div class="child-item">售后处理</div>
                <div class="child-item">物流追踪</div>
              </div>
            </section>
          `;
        },
        unmount(container) {
          container.innerHTML = '';
        },
      };

      const financeApp = {
        mount(container) {
          container.innerHTML = `
            <section class="child-panel">
              <div class="child-head">
                <div>
                  <span class="child-badge finance">财务子应用</span>
                  <h2>财务管理</h2>
                </div>
              </div>
              <div class="child-list">
                <div class="child-item finance">账单中心</div>
                <div class="child-item finance">开票处理</div>
                <div class="child-item finance">退款打款</div>
              </div>
            </section>
          `;
        },
        unmount(container) {
          container.innerHTML = '';
        },
      };

      const apps = {
        order: orderApp,
        finance: financeApp,
      };

      let currentApp = null;

      function switchApp(name) {
        const nextApp = apps[name];

        if (!nextApp) {
          return;
        }

        if (currentApp) {
          currentApp.unmount(subapp);
        }

        nextApp.mount(subapp);
        currentApp = nextApp;

        buttons.forEach((button) => {
          button.classList.toggle('active', button.dataset.app === name);
        });
      }

      buttons.forEach((button) => {
        button.addEventListener('click', () => {
          switchApp(button.dataset.app);
        });
      });

      switchApp('order');
    </script>
  </body>
</html>
