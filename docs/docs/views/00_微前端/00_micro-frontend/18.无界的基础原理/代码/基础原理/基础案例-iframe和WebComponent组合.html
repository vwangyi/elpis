<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>运营工作台</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; font-family: "PingFang SC", sans-serif; color: #24352f; background: #eef2ed; }
      .shell { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
      aside { padding: 28px 20px; color: #fff; background: #243a32; }
      aside h1 { margin: 0 0 28px; font-size: 22px; }
      nav { display: grid; gap: 8px; }
      nav span { padding: 11px 12px; border-radius: 7px; color: #b9c8c1; }
      nav .active { color: #24352f; background: #f3efe4; }
      main { padding: 30px; }
      main > header { margin-bottom: 20px; }
      main > header h2 { margin: 0 0 6px; font-size: 28px; }
      main > header p { margin: 0; color: #6a7972; }
      mini-app { display: block; }

      @media (max-width: 700px) {
        .shell { grid-template-columns: 1fr; }
        aside { padding: 20px; }
        main { padding: 20px; }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <aside>
        <h1>Retail Console</h1>
        <nav>
          <span class="active">订单中心</span>
          <span>财务中心</span>
        </nav>
      </aside>

      <main>
        <header>
          <h2>运营工作台</h2>
          <p>处理订单履约和异常任务</p>
        </header>
        <mini-app name="order"></mini-app>
      </main>
    </div>

    <script>
      // 将业务入口写成一个普通函数,模拟子应用的 JS 代码
      // 真正接入远程子应用时，需要增加 HTML Entry 加载过程
      function childApplication() {
        const style = document.createElement("style");
        style.textContent = `
          .order-app { padding: 24px; border-radius: 12px; background: #fff; }
          .order-header { display: flex; justify-content: space-between; align-items: center; }
          .order-header h3 { margin: 0; font-size: 22px; }
          .order-header span { padding: 5px 9px; border-radius: 20px; color: #256348; background: #dff0e7; font-size: 12px; }
          .metrics { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin: 20px 0; }
          .metric { padding: 16px; border-radius: 9px; background: #f3f7f4; }
          .metric small { display: block; color: #73817b; }
          .metric strong { display: block; margin-top: 6px; font-size: 26px; }
          table { width: 100%; border-collapse: collapse; }
          th, td { padding: 12px; border-bottom: 1px solid #e4e9e5; text-align: left; }
          th { color: #718078; font-size: 13px; }
          .actions { display: flex; gap: 10px; margin-top: 20px; }
          button { padding: 9px 13px; border: 0; border-radius: 7px; color: #fff; background: #326b55; cursor: pointer; }
          button:last-child { background: #a27434; }
          .notice { margin-top: 12px; padding: 12px; border-left: 4px solid #c88b35; background: #fff5df; }
        `;
        document.head.appendChild(style);

        const app = document.querySelector("#app");
        app.innerHTML = `
          <section class="order-app">
            <header class="order-header">
              <h3>订单履约</h3>
              <span>运行中</span>
            </header>
            <div class="metrics">
              <div class="metric"><small>待处理订单</small><strong id="pending">12</strong></div>
              <div class="metric"><small>异常任务</small><strong>3</strong></div>
            </div>
            <table>
              <thead><tr><th>订单号</th><th>客户</th><th>状态</th></tr></thead>
              <tbody>
                <tr><td>OD-1048</td><td>华东门店</td><td>待发货</td></tr>
                <tr><td>OD-1047</td><td>南区仓库</td><td>配货中</td></tr>
                <tr><td>OD-1046</td><td>北区门店</td><td>异常</td></tr>
              </tbody>
            </table>
            <div class="actions">
              <button id="complete" type="button">完成一笔订单</button>
              <button id="remind" type="button">新增异常提醒</button>
            </div>
          </section>
        `;

        let pending = 12;
        document.querySelector("#complete").addEventListener("click", () => {
          pending = Math.max(0, pending - 1);
          document.querySelector("#pending").textContent = pending;
        });

        document.querySelector("#remind").addEventListener("click", () => {
          const notice = document.createElement("div");
          notice.className = "notice";
          notice.textContent = "订单 OD-1046 需要人工处理";
          document.body.appendChild(notice);
        });
      }

      class MiniAppElement extends HTMLElement {
        constructor() {
          super();
          this.attachShadow({ mode: "open" });
        }

        connectedCallback() {
          this.start();
        }

        async start() {
          this.shadowRoot.innerHTML = `
            <mini-app-head></mini-app-head>
            <mini-app-body><div id="app">加载订单中心...</div></mini-app-body>
          `;

          const iframe = document.createElement("iframe");
          iframe.hidden = true;

          const iframeReady = new Promise((resolve) => {
            iframe.addEventListener("load", resolve, { once: true });
          });

          iframe.srcdoc = "<!doctype html><html><head></head><body></body></html>";
          this.appendChild(iframe);
          await iframeReady;

          // iframe提供了一套浏览器原生对象
          // 由于 iframe 是一个独立的浏览器环境，所以 iframe.contentWindow、iframe.contentDocument 都是独立的对象
          // 所以不需要向qiankun一样，使用new Proxy来代理window、document等对象
          // 但是又有新的问题，子应用JS将在iframe中运行
          // 子应用 #app 却在外面的Shadow Root中
          // 正常情况下 frameDocument.querySelector("#app") 只能查询 iframe 自己的 DOM，结果是 `null`
          // 但是 我们是想查询的shadow root 中的 #app
          // const frameWindow = iframe.contentWindow;
          const frameDocument = iframe.contentDocument;

          // 子应用 JS 将在 iframe 中运行，子应用 #app 却在外面的 Shadow Root 中
          // 正常情况下：frameDocument.querySelector("#app");只能查询 iframe 自己的 DOM，结果是 `null`
          // 所以必须连接 `frameDocument` 和 Shadow Root，才能让子应用 JS 查询到 Shadow Root 中的 #app
          this.restoreDocument = this.bridgeDocument(frameDocument);

          // 把函数转换成 iframe 中的 module script
          // childApplication 是一个普通函数，里面的代码就是子应用的 JS 代码
          // 但不能直接在主应用中调用,这样函数仍然在主应用 window 中运行
          // 所以要把函数转换成 iframe 中的 module script,让函数在 iframe window 中运行
          const script = frameDocument.createElement("script");
          script.type = "module";
          // 因为 script 被插入 iframe document，所以函数中的window、document等等都属于 iframe。
          // 也就是说，随后它执行比如：const app = document.querySelector("#app");
          // document.querySelector 又经过刚才的代理，返回 Shadow Root 中的 #app
          script.textContent = `(${childApplication.toString()})()`;
          frameDocument.head.appendChild(script);
          this.iframe = iframe;
        }
        // 完整的过程：
        // childApplication 在 iframe.window中执行
        // 可能会调用 iframe.document.querySelector("#app")
        // document 代理查询 Shadow Root 中的 #app
        // 得到Shadow Root 中的 真实DOM节点，返回给子应用 JS
        // 子应用代码修改这个节点
        // 主应用页面出现订单中心

        bridgeDocument(frameDocument) {
          const shadowHead = this.shadowRoot.querySelector("mini-app-head");
          const shadowBody = this.shadowRoot.querySelector("mini-app-body");
          const rawQuerySelector = frameDocument.querySelector.bind(frameDocument);
          const rawHeadAppendChild = frameDocument.head.appendChild.bind(frameDocument.head);
          const rawBodyAppendChild = frameDocument.body.appendChild.bind(frameDocument.body);

          // 代理 querySelector
          frameDocument.querySelector = (selector) =>
            this.shadowRoot.querySelector(selector) || rawQuerySelector(selector);

          // 代理 head.appendChild
          frameDocument.head.appendChild = (node) =>
            node instanceof frameDocument.defaultView.HTMLStyleElement
              ? shadowHead.appendChild(node)
              : rawHeadAppendChild(node);

          // 代理 body.appendChild
          frameDocument.body.appendChild = (node) => shadowBody.appendChild(node);

          // 返回“恢复函数”，但暂时不执行,调用方只是保存了这个函数
          // 子应用销毁时才执行恢复函数
          return () => {
            frameDocument.querySelector = rawQuerySelector;
            frameDocument.head.appendChild = rawHeadAppendChild;
            frameDocument.body.appendChild = rawBodyAppendChild;
          };
        }

        disconnectedCallback() {
          // 子应用销毁时执行恢复函数
          this.restoreDocument?.();
          this.iframe?.remove();
        }
      }

      customElements.define("mini-app", MiniAppElement);
    </script>
  </body>
</html>
