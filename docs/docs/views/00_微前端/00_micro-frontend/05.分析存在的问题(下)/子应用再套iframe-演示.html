<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>子应用再套 iframe 演示</title>
    <style>
      :root {
        color: #1f2937;
        background: linear-gradient(180deg, #f8fafc 0%, #eef2ff 100%);
        font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
      }

      button {
        font: inherit;
      }

      .page {
        max-width: 1320px;
        margin: 0 auto;
        padding: 32px 24px 48px;
      }

      .hero {
        padding: 28px;
        border-radius: 28px;
        color: #eff6ff;
        background: linear-gradient(135deg, #1d4ed8, #3730a3);
        box-shadow: 0 24px 48px rgba(15, 23, 42, 0.14);
      }

      .hero h1 {
        margin: 0 0 10px;
        font-size: 34px;
      }

      .hero p {
        margin: 0;
        max-width: 900px;
        line-height: 1.85;
      }

      .hero strong {
        color: #dbeafe;
      }

      .hero .actions {
        margin-top: 16px;
      }

      .grid {
        margin-top: 22px;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 20px;
      }

      .card {
        padding: 22px;
        border: 1px solid rgba(31, 41, 55, 0.08);
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.9);
        box-shadow: 0 18px 40px rgba(15, 23, 42, 0.08);
      }

      .card h2 {
        margin: 0 0 10px;
        font-size: 24px;
      }

      .card p {
        margin: 0;
        color: #4b5563;
        line-height: 1.8;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .actions button {
        appearance: none;
        border: 0;
        border-radius: 14px;
        padding: 11px 14px;
        font-weight: 700;
        color: #eef2ff;
        background: #3730a3;
        cursor: pointer;
      }

      .shell {
        margin-top: 16px;
        border-radius: 20px;
        border: 1px solid rgba(99, 102, 241, 0.18);
        background: linear-gradient(180deg, #eef2ff 0%, #f8fafc 100%);
        overflow: hidden;
      }

      .shell-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 16px;
        color: #312e81;
        background: rgba(199, 210, 254, 0.72);
        border-bottom: 1px solid rgba(99, 102, 241, 0.14);
        font-weight: 700;
      }

      .shell-body {
        padding: 16px;
      }

      .state-box {
        padding: 14px;
        border-radius: 16px;
        background: #0f172a;
        color: #dbeafe;
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        font-size: 13px;
        line-height: 1.7;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .frame-wrap {
        margin-top: 14px;
        padding: 12px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.86);
        border: 1px solid rgba(148, 163, 184, 0.22);
      }

      .frame-label {
        margin-bottom: 10px;
        color: #475569;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.04em;
      }

      iframe {
        width: 100%;
        height: 260px;
        border: 1px solid rgba(99, 102, 241, 0.16);
        border-radius: 16px;
        background: #ffffff;
      }

      @media (max-width: 980px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <section class="hero">
        <h1>子应用里再套 iframe，边界为什么会再多一层</h1>
        <p>
          左边只把 iframe 塞进来，<strong>不做桥接</strong>；右边让 iframe 主动把<strong>当前路径</strong>和<strong>页面高度</strong>发出来。两边一对比，就能看出为什么这层边界不会被框架自动抹平。
        </p>
        <div class="actions">
          <button type="button" id="reset-btn">重置两个场景</button>
        </div>
      </section>

      <section class="grid">
        <article class="card">
          <h2>不做桥接</h2>
          <p>iframe 内部自己切页、自己变高，外层默认不知道。</p>
          <div class="shell">
            <div class="shell-header">
              <span>主应用外壳</span>
              <span>子应用内还有一个 iframe</span>
            </div>
            <div class="shell-body">
              <div class="state-box" id="raw-state"></div>
              <div class="frame-wrap">
                <div class="frame-label">子应用里的 iframe</div>
                <iframe id="raw-frame" sandbox="allow-scripts"></iframe>
              </div>
            </div>
          </div>
        </article>

        <article class="card">
          <h2>显式桥接</h2>
          <p>iframe 用 postMessage 主动上报路径和高度，外层才能同步。</p>
          <div class="shell">
            <div class="shell-header">
              <span>主应用外壳</span>
              <span>收到 iframe 的显式消息桥</span>
            </div>
            <div class="shell-body">
              <div class="state-box" id="bridge-state"></div>
              <div class="frame-wrap">
                <div class="frame-label">子应用里的 iframe</div>
                <iframe id="bridge-frame" sandbox="allow-scripts"></iframe>
              </div>
            </div>
          </div>
        </article>
      </section>
    </div>

    <script>
      const rawFrame = document.querySelector('#raw-frame')
      const bridgeFrame = document.querySelector('#bridge-frame')
      const rawStateEl = document.querySelector('#raw-state')
      const bridgeStateEl = document.querySelector('#bridge-state')
      const resetBtn = document.querySelector('#reset-btn')

      const bridgeState = {
        hostKnownPath: '未知',
        iframeHeight: '260px',
        messageCount: 0,
        lastEvent: '还没有收到消息',
      }

      function renderStates() {
        rawStateEl.textContent = JSON.stringify(
          {
            hostKnownPath: '未知',
            iframeHeight: '固定 260px',
            messageCount: 0,
            lastEvent: '没有桥接，外层拿不到内部状态',
          },
          null,
          2,
        )

        bridgeStateEl.textContent = JSON.stringify(bridgeState, null, 2)
      }

      function buildFrameDoc(mode) {
        const useBridge = mode === 'bridge'

        return `<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <style>
      :root {
        color: #1f2937;
        font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #ffffff;
      }

      .page {
        padding: 16px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 14px;
        padding: 12px 14px;
        border-radius: 16px;
        color: #0f172a;
        background: linear-gradient(135deg, #e2e8f0, #f8fafc);
      }

      .topbar strong {
        font-size: 14px;
      }

      .badge {
        padding: 6px 10px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
        color: #4338ca;
        background: #e0e7ff;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      button {
        appearance: none;
        border: 0;
        border-radius: 12px;
        padding: 9px 12px;
        font: inherit;
        font-weight: 700;
        color: #eef2ff;
        background: #4f46e5;
        cursor: pointer;
      }

      button.alt {
        color: #312e81;
        background: #e0e7ff;
      }

      .route-box,
      .content {
        margin-top: 12px;
        padding: 14px;
        border-radius: 16px;
        border: 1px solid rgba(99, 102, 241, 0.16);
        background: #f8fafc;
      }

      .route-box strong {
        display: block;
        margin-bottom: 8px;
      }

      .route-value {
        color: #312e81;
        font-weight: 700;
      }

      .tips {
        margin-top: 8px;
        color: #64748b;
        font-size: 13px;
        line-height: 1.7;
      }

      ul {
        margin: 10px 0 0;
        padding-left: 20px;
        color: #475569;
        line-height: 1.8;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="topbar">
        <strong>审批中心 iframe</strong>
        <span class="badge">${useBridge ? '显式桥接' : '不做桥接'}</span>
      </div>

      <div class="actions">
        <button type="button" data-path="/reports/home">回到列表</button>
        <button type="button" data-path="/reports/detail/1024">进入审批详情</button>
        <button type="button" class="alt" id="toggle-btn">展开长内容</button>
      </div>

      <div class="route-box">
        <strong>iframe 内部当前页</strong>
        <div class="route-value" id="path-view"></div>
        <div class="tips">这一层路由只在 iframe 里面自己变化。外层想知道，必须靠显式桥接。</div>
      </div>

      <div class="content" id="content-box"></div>
    </div>

    <script>
      const state = {
        path: '/reports/home',
        expanded: false,
      }

      const pathView = document.querySelector('#path-view')
      const contentBox = document.querySelector('#content-box')
      const toggleBtn = document.querySelector('#toggle-btn')

      function postState() {
        if (!${useBridge}) return

        window.parent.postMessage(
          {
            channel: 'child-iframe-bridge',
            mode: '${mode}',
            path: state.path,
            height: document.documentElement.scrollHeight,
            event: state.expanded ? 'iframe 内容已展开' : 'iframe 路由变化',
          },
          '*',
        )
      }

      function render() {
        pathView.textContent = state.path
        toggleBtn.textContent = state.expanded ? '收起长内容' : '展开长内容'

        const detail = state.path === '/reports/detail/1024'
          ? '<p>当前已经进入审批详情页。这里通常会继续放审批记录、附件流转、报表图表。</p>'
          : '<p>当前停在报表列表页。列表切换看起来只是 iframe 内部自己的事情。</p>'

        const longList = state.expanded
          ? '<ul>' + Array.from({ length: 12 }, (_, index) => '<li>审批节点 ' + (index + 1) + '：等待下一层容器接住高度和状态。</li>').join('') + '</ul>'
          : ''

        contentBox.innerHTML = detail + longList
        requestAnimationFrame(postState)
      }

      document.querySelectorAll('[data-path]').forEach((button) => {
        button.addEventListener('click', () => {
          state.path = button.dataset.path
          render()
        })
      })

      toggleBtn.addEventListener('click', () => {
        state.expanded = !state.expanded
        render()
      })

      render()
    <\/script>
  </body>
</html>`
      }

      function mountFrames() {
        bridgeState.hostKnownPath = '未知'
        bridgeState.iframeHeight = '260px'
        bridgeState.messageCount = 0
        bridgeState.lastEvent = '还没有收到消息'
        bridgeFrame.style.height = '260px'

        rawFrame.srcdoc = buildFrameDoc('raw')
        bridgeFrame.srcdoc = buildFrameDoc('bridge')
        renderStates()
      }

      window.addEventListener('message', (event) => {
        const data = event.data

        if (data?.channel !== 'child-iframe-bridge' || data.mode !== 'bridge') {
          return
        }

        const nextHeight = Math.max(260, Number(data.height) || 260)
        bridgeFrame.style.height = `${nextHeight}px`
        bridgeState.hostKnownPath = data.path
        bridgeState.iframeHeight = `${nextHeight}px`
        bridgeState.messageCount += 1
        bridgeState.lastEvent = data.event
        renderStates()
      })

      resetBtn.addEventListener('click', mountFrames)

      mountFrames()
    </script>
  </body>
</html>
