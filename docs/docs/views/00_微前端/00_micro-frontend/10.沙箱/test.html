    // ECMAScript 规范中规定，eval 函数有两种调用方式：
    // 1. 直接调用eval时：他会创建/使用当前执行上下文中的变量环境
    // 2. 间接调用eval时：（任何不是直接使用标识符eval的调用），它会在全局环境中执行
    //  

  window.appName = "全局window上的appName";

  function mainAppLoader(){
    const appName = "主应用加载函数里的appName";
    const childScript = "console.log(appName)";

    // 直接调用
    eval(childScript);

    // 间接调用
    // (0, eval)(childScript);

    // const indirectEval = eval;
    // indirectEval(childScript);

    // (0,eval) 其实就是利用了逗号运算符的基本规则
    // 逗号运算符会从左导游执行每个表达式，然后返回最后一个表达式的值
    const indirectEval = (0, eval);
    indirectEval(childScript);
  }

  mainAppLoader();
